# Intention recipe for ai-rulez consumers.
# For a published library pin, replace each include with:
#   source = "https://github.com/mrjk/ai-rules.git"
#   path = "modules/<module>"
#   ref = "vX.Y.Z"
# Local paths below work from a checkout of this repo (CI / dogfood).

version = "4.0"
name = "sh-script-fast"
description = "REPLACE ME: what this POSIX sh script does"

presets = ["cursor", "codex", "copilot"]
gitignore = true

builtins = [
  "ai-governance",
  "code-quality",
  "git-workflow",
  "security",
  "token-efficiency",
  "default-commands",
]

[[includes]]
name = "house"
source = "../../modules/house"
include = ["rules", "context", "skills", "agents"]
merge_strategy = "local-override"

[[includes]]
name = "sdlc"
source = "../../modules/sdlc"
include = ["rules", "context", "skills", "agents"]
merge_strategy = "local-override"

[[includes]]
name = "security"
source = "../../modules/security"
include = ["rules", "context", "skills", "agents"]
merge_strategy = "local-override"

[[includes]]
name = "tool-mise"
source = "../../modules/tool-mise"
include = ["rules", "context", "skills", "agents"]
merge_strategy = "local-override"

[[includes]]
name = "tool-task"
source = "../../modules/tool-task"
include = ["rules", "context", "skills", "agents"]
merge_strategy = "local-override"

[[includes]]
name = "stack-sh-script"
source = "../../modules/stack-sh-script"
include = ["rules", "context", "skills", "agents"]
merge_strategy = "local-override"

[[includes]]
name = "pov-mrjk"
source = "../../modules/pov-mrjk"
include = ["rules", "context", "skills", "agents"]
merge_strategy = "local-override"

[[mcp_servers]]
name = "ai-rulez"
command = "mise"
args = ["exec", "--", "ai-rulez", "mcp"]
