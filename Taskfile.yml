# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  MODULES_DIR: '{{.ROOT_DIR}}/modules'
  EXAMPLES_DIR: '{{.ROOT_DIR}}/examples'
  DOCS_DIR: '{{.ROOT_DIR}}/docs'
  DOCS_DIST: '{{.DOCS_DIR}}/dist'
  MISE: mise
  AIRULEZ: '"$({{.MISE}} -C ''{{.ROOT_DIR}}'' which ai-rulez)"'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install tools pinned in mise.toml
    cmds:
      - '{{.MISE}} install'

  help:
    desc: 'Show ai-rulez CLI help (usage: task help -- validate)'
    cmds:
      - '{{.AIRULEZ}} {{.CLI_ARGS}}'

  rulez:
    desc: 'Pass args to ai-rulez (usage: task rulez -- validate)'
    cmds:
      - '{{.AIRULEZ}} {{.CLI_ARGS}}'

  validate:
    desc: Validate this repo's ai-rulez config and every example recipe
    cmds:
      - '{{.AIRULEZ}} validate'
      - |
        for d in '{{.EXAMPLES_DIR}}'/*/; do
          name="$(basename "${d%/}")"
          echo "== examples/$name"
          (cd "{{.EXAMPLES_DIR}}/$name" && {{.AIRULEZ}} validate)
        done

  build:
    desc: Generate agent files from .ai-rulez/
    cmds:
      - '{{.AIRULEZ}} generate {{.CLI_ARGS}}'

  list:
    desc: List rules visible to this repo's config
    cmds:
      - '{{.AIRULEZ}} list rules {{.CLI_ARGS}}'

  apply:
    desc: 'Copy an example recipe into a project (usage: task apply RECIPE=python-cli-standard TARGET=/path)'
    requires:
      vars: [RECIPE, TARGET]
    vars:
      SRC: '{{.EXAMPLES_DIR}}/{{.RECIPE}}/.ai-rulez/config.toml'
    cmds:
      - |
        test -f '{{.SRC}}' || { echo "No such recipe: {{.SRC}}" >&2; exit 1; }
      - mkdir -p '{{.TARGET}}/.ai-rulez'
      - cp '{{.SRC}}' '{{.TARGET}}/.ai-rulez/config.toml'
      - echo "Wrote {{.TARGET}}/.ai-rulez/config.toml"
      - |
        echo "Rewrite includes for git source+ref (see examples/README.md), then run ai-rulez generate"

  docs:install:
    desc: Install Starlight dependencies
    dir: '{{.DOCS_DIR}}'
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    cmds:
      - npm ci

  docs:dev:
    desc: Preview the documentation site locally
    dir: '{{.DOCS_DIR}}'
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    cmds:
      - npm ci
      - npm run dev

  docs:build:
    desc: Build the documentation site into docs/dist
    dir: '{{.DOCS_DIR}}'
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    cmds:
      - npm ci
      - npm run build

  ci:
    desc: Validate the library and build the documentation site
    cmds:
      - task: validate
      - task: docs:build
