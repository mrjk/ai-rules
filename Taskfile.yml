# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  # Source of truth: the rule library in this repo.
  SRC_SUBDIR: src
  RULES_SUBDIR: rules
  PROFILES_SUBDIR: profiles
  SRC_DIR: '{{.ROOT_DIR}}/{{.SRC_SUBDIR}}'
  RULES_DIR: '{{.SRC_DIR}}/{{.RULES_SUBDIR}}'
  PROFILES_DIR: '{{.SRC_DIR}}/{{.PROFILES_SUBDIR}}'
  # Relative to .rulesmith/, the directory that holds the bootstrap symlink.
  BOOTSTRAP_RULES_REL: '../{{.SRC_SUBDIR}}/{{.RULES_SUBDIR}}'
  # Where ai-rulesmith looks for global rules (see docs/structure.md).
  GLOBAL_RULES_DIR: '{{.HOME}}/.config/rulesmith/rules'
  # Per project locations, relative to the consuming project.
  PROJECT_RULES_SUBDIR: '.rulesmith/rules'
  PROJECT_CONFIG_NAME: 'AI_RULES.json'
  MISE: mise
  # Absolute binary from this repo's mise.toml, so apply can cd into TARGET.
  RULESMITH: '"$({{.MISE}} -C ''{{.ROOT_DIR}}'' which ai-rulesmith)"'
  # rulesmith previews and asks for confirmation by default, which does not work unattended.
  BUILD_FLAGS: '--force --no-preview'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install tools pinned in mise.toml
    cmds:
      - '{{.MISE}} install'

  help:
    desc: 'Show ai-rulesmith CLI help (usage: task help -- [command])'
    cmds:
      - '{{.RULESMITH}} help {{.CLI_ARGS}}'

  rulesmith:
    desc: 'Pass args to ai-rulesmith (usage: task rulesmith -- --help)'
    cmds:
      - '{{.RULESMITH}} {{.CLI_ARGS}}'

  bootstrap:
    desc: Make this repo resolve its own rules, so validate and build work without a global install
    status:
      - test -L '{{.ROOT_DIR}}/{{.PROJECT_RULES_SUBDIR}}'
      - test "$(readlink '{{.ROOT_DIR}}/{{.PROJECT_RULES_SUBDIR}}')" = '{{.BOOTSTRAP_RULES_REL}}'
    cmds:
      - mkdir -p '{{.ROOT_DIR}}/{{.PROJECT_RULES_SUBDIR | dir}}'
      - ln -sfn '{{.BOOTSTRAP_RULES_REL}}' '{{.ROOT_DIR}}/{{.PROJECT_RULES_SUBDIR}}'

  link:
    desc: Install this library globally by symlinking src/rules into ~/.config/rulesmith
    cmds:
      - mkdir -p "$(dirname '{{.GLOBAL_RULES_DIR}}')"
      - |
        if [ -e '{{.GLOBAL_RULES_DIR}}' ] && [ ! -L '{{.GLOBAL_RULES_DIR}}' ]; then
          echo "Refusing to replace real directory {{.GLOBAL_RULES_DIR}}" >&2
          echo "Move it aside, or use 'task vendor' instead." >&2
          exit 1
        fi
      - ln -sfn '{{.RULES_DIR}}' '{{.GLOBAL_RULES_DIR}}'
      - echo "Linked {{.GLOBAL_RULES_DIR}} -> {{.RULES_DIR}}"

  unlink:
    desc: Remove the global symlink
    cmds:
      - |
        if [ -L '{{.GLOBAL_RULES_DIR}}' ]; then
          rm '{{.GLOBAL_RULES_DIR}}'
          echo "Removed {{.GLOBAL_RULES_DIR}}"
        else
          echo "Nothing to remove: {{.GLOBAL_RULES_DIR}} is not a symlink"
        fi

  vendor:
    desc: 'Copy a snapshot of the library into a project (usage: task vendor TARGET=/path/to/project)'
    requires:
      vars: [TARGET]
    vars:
      DEST: '{{.TARGET}}/{{.PROJECT_RULES_SUBDIR}}'
    cmds:
      - mkdir -p '{{.DEST}}'
      - rsync -a --delete '{{.RULES_DIR}}/' '{{.DEST}}/'
      - echo "Vendored into {{.DEST}}"

  apply:
    desc: 'Install a profile into a project and build it (usage: task apply PROFILE=python-cli-standard TARGET=/path)'
    requires:
      vars: [PROFILE, TARGET]
    vars:
      SRC: '{{.PROFILES_DIR}}/{{.PROFILE}}.json'
    cmds:
      - |
        test -f '{{.SRC}}' || { echo "No such profile: {{.SRC}}" >&2; exit 1; }
      - cp '{{.SRC}}' '{{.TARGET}}/{{.PROJECT_CONFIG_NAME}}'
      # rulesmith resolves both rules and output paths against the cwd, so build from the target.
      - cd '{{.TARGET}}' && {{.RULESMITH}} build {{.BUILD_FLAGS}}
      - task: normalize
        vars:
          TARGET: '{{.TARGET}}'

  build:
    desc: Build agent files for this repo from its own AI_RULES.json
    deps: [bootstrap]
    cmds:
      - '{{.RULESMITH}} build {{.BUILD_FLAGS}} {{.CLI_ARGS}}'
      - task: normalize

  validate:
    desc: Validate this repo's config and every profile
    deps: [bootstrap]
    cmds:
      - '{{.RULESMITH}} validate'
      - |
        for f in '{{.PROFILES_DIR}}'/*.json; do
          echo "== $f"
          {{.RULESMITH}} validate -c "$f"
        done

  list:
    desc: List all resolvable rules (custom, global and built-in)
    deps: [bootstrap]
    cmds:
      - '{{.RULESMITH}} list-rules {{.CLI_ARGS}}'

  normalize:
    desc: 'Rewrite non ASCII dashes in generated files (usage: task normalize [TARGET=/path])'
    vars:
      DIR: '{{default .ROOT_DIR .TARGET}}'
    cmds:
      # Only touch files carrying the generator marker, so hand written sources are never rewritten.
      # The em dash and en dash come from the tool header and from some built-in rules.
      - |
        grep -rlZ 'Generated by AI Rulesmith' '{{.DIR}}' \
          --exclude-dir=.git --exclude-dir=node_modules \
          | xargs -0 -r sed -i 's/\xe2\x80\x94/-/g; s/\xe2\x80\x93/-/g'
